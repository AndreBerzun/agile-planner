<div class="d-flex flex-wrap align-items-center py-2">
  <div
    class="d-flex flex-wrap align-items-center"
    cdkDropList
    cdkDropListOrientation="mixed"
    (cdkDropListDropped)="onProjectDrop($event)"
  >
    @for (project of state.projects; track project.controls.id.value) {
      <button
        type="button"
        class="retro tab"
        cdkDrag
        cdkDragPreviewContainer="parent"
        [class.active]="project.controls.id.value === state.activeProjectId"
        (click)="state.selectProject(project.controls.id.value!)"
      >{{ project.controls.name.value || 'Unnamed' }}</button>
    }
  </div>
  <button type="button" class="retro" title="New project" (click)="state.addProject()">+</button>
</div>
